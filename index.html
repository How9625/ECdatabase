<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>島らっきょう販売管理ダッシュボード</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f5f6fa;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219a52;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        @media (max-width: 600px) {
            th, td {
                padding: 8px 5px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 島らっきょう販売管理</h1>

    <div class="card">
        <h2>新規データ入力</h2>
        <form id="salesForm">
            <div class="form-group">
                <label for="orderDate">注文日</label>
                <input type="date" id="orderDate" required>
            </div>
            <div class="form-group">
                <label for="amount">内容量 (g)</label>
                <input type="number" id="amount" placeholder="例: 500" required>
            </div>
            <div class="form-group">
                <label for="shipping">配送方法</label>
                <select id="shipping">
                    <option value="通常便">通常便(メルカリ便)</option>
                    <option value="クール便">クール便(ヤマト等)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="price">販売価格 (円)</label>
                <input type="number" id="price" placeholder="例: 2000" required>
            </div>
            <div class="form-group">
                <label for="prefecture">発送先（都道府県）</label>
                <input type="text" id="prefecture" placeholder="例: 東京都" required>
            </div>
            <button type="button" onclick="alert('この機能は次のステップでデータベース（GAS）と連携させます！')">データを登録する</button>
        </form>
    </div>

    <div class="card">
        <h2>最近の登録データ (プレビュー)</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>容量(g)</th>
                        <th>価格(円)</th>
                        <th>発送先</th>
                        <th>配送方法</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>2026/08/13</td>
                        <td>500</td>
                        <td>2000</td>
                        <td>東京都</td>
                        <td>通常便</td>
                    </tr>
                    <tr>
                        <td>2026/08/12</td>
                        <td>800</td>
                        <td>3100</td>
                        <td>大阪府</td>
                        <td>クール便</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
